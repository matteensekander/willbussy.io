<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>willbussy.io</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #06070d; overflow: hidden; font-family: 'Inter', 'Segoe UI', sans-serif; }
#gameCanvas { display: block; cursor: default; }

/* ── HUD ── */
#minimapCanvas {
  position: fixed; bottom: 20px; right: 20px;
  border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
  background: rgba(0,0,0,0.5); display: none;
}
#hud {
  position: fixed; top: 16px; left: 16px; color: #fff; font-size: 14px;
  display: none; line-height: 1.9; pointer-events: none; z-index: 50;
  text-shadow: 0 0 10px rgba(0,255,200,0.5);
}
#hud span { color: #00ffcc; font-weight: 700; }
#dashStatus { font-size: 12px; margin-top: 3px; font-weight: 600; letter-spacing: 0.4px; }
#leaderboard {
  position: fixed; top: 16px; right: 16px;
  background: rgba(6,7,13,0.8); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; padding: 10px 14px; color: #fff;
  font-size: 13px; min-width: 165px; display: none;
  pointer-events: none; z-index: 50; backdrop-filter: blur(12px);
}
#leaderboard .lb-title { font-weight: 700; font-size: 13px; margin-bottom: 7px; color: #ffcc00; letter-spacing: 0.5px; }
#powerupBar {
  position: fixed; bottom: 18px; left: 18px;
  display: flex; gap: 8px; pointer-events: none; z-index: 50; display: none;
}
.pu-chip {
  background: rgba(0,0,0,0.8); border-radius: 10px; padding: 6px 10px;
  display: flex; flex-direction: column; align-items: center;
  font-size: 17px; border: 1.5px solid; color: #fff; min-width: 42px;
}
.pu-chip small { font-size: 9px; margin-top: 2px; opacity: 0.8; }

/* ── Overlay (title + death) ── */
#overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center; z-index: 100;
  overflow-y: auto; padding: 20px 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,200,255,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 80% 100%, rgba(180,0,255,0.06) 0%, transparent 70%),
    #06070d;
}

/* ── Shared card ── */
.screen {
  text-align: center; color: #fff; width: 100%; max-width: 460px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px; padding: 28px 28px 24px;
  backdrop-filter: blur(24px);
  box-shadow: 0 0 60px rgba(0,200,255,0.05), 0 24px 64px rgba(0,0,0,0.5);
}

/* ── Title ── */
.game-title {
  font-size: 46px; font-weight: 900; letter-spacing: -1px;
  font-family: 'Inter', 'Arial Black', sans-serif;
  background: linear-gradient(100deg, #00e5ff 0%, #bf5fff 45%, #00ffaa 80%, #ffd740 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  filter: drop-shadow(0 0 14px rgba(0,220,255,0.35));
  animation: titlePulse 3s ease-in-out infinite alternate;
  line-height: 1.1; margin-bottom: 4px;
}
@keyframes titlePulse {
  from { filter: drop-shadow(0 0 8px rgba(0,220,255,0.3)); }
  to   { filter: drop-shadow(0 0 22px rgba(180,80,255,0.45)); }
}
.subtitle {
  color: rgba(255,255,255,0.35); font-size: 12px; letter-spacing: 3px;
  text-transform: uppercase; margin-bottom: 14px; font-weight: 400;
}

/* ── Logo canvas ── */
#logoCanvas { display: block; margin: 0 auto 16px; border-radius: 8px; }

/* ── Divider ── */
.divider { border: none; border-top: 1px solid rgba(255,255,255,0.07); margin: 14px 0; }

/* ── Skin selector ── */
.skin-label { color: rgba(255,255,255,0.4); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
.skins {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 8px;
  margin-bottom: 16px;
}
.skin-opt {
  border-radius: 12px; cursor: pointer; border: 1.5px solid transparent;
  transition: all 0.2s; display: flex; flex-direction: column; align-items: center;
  justify-content: center; font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
  padding: 10px 0; gap: 4px; pointer-events: all;
}
.skin-opt:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.3); }
.skin-opt.sel { border-color: #fff; box-shadow: 0 0 14px rgba(255,255,255,0.2); transform: translateY(-2px); }

/* ── Name + Play row ── */
.play-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
#playerNameInput {
  flex: 1; padding: 11px 16px; font-size: 14px; border-radius: 12px;
  border: 1.5px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
  color: #fff; outline: none; font-family: inherit;
  transition: border-color 0.2s; pointer-events: all;
}
#playerNameInput::placeholder { color: rgba(255,255,255,0.25); }
#playerNameInput:focus { border-color: rgba(0,220,255,0.5); background: rgba(0,220,255,0.04); }
.play-btn {
  padding: 11px 26px; font-size: 15px; font-weight: 800; border: none;
  border-radius: 12px; cursor: pointer; pointer-events: all;
  background: linear-gradient(135deg, #00c8ff, #00ffaa); color: #000;
  letter-spacing: 0.5px; transition: all 0.2s; white-space: nowrap;
  box-shadow: 0 0 20px rgba(0,200,255,0.25);
}
.play-btn:hover { transform: translateY(-1px); box-shadow: 0 0 28px rgba(0,200,255,0.4); }

/* ── Controls hint ── */
.controls-hint {
  color: rgba(255,255,255,0.2); font-size: 11px; letter-spacing: 0.3px;
  line-height: 1.7;
}
.controls-hint kbd {
  background: rgba(255,255,255,0.08); border-radius: 4px;
  padding: 1px 5px; font-family: monospace; font-size: 11px; color: rgba(255,255,255,0.4);
}

/* ── High scores (title page) ── */
#hsSection { margin-top: 14px; }
#hsSummary {
  display: flex; justify-content: center; gap: 18px; flex-wrap: wrap;
  font-size: 12px; color: rgba(255,255,255,0.35); cursor: pointer;
}
#hsSummary span { white-space: nowrap; }
#hsSummary span:first-child { color: #ffd740; }
#hsSummary span:nth-child(2) { color: #c0c0c0; }
#hsSummary span:nth-child(3) { color: #cd7f32; }
#hsExpandBtn {
  display: block; margin: 8px auto 0; font-size: 11px; color: rgba(255,255,255,0.2);
  cursor: pointer; background: none; border: none; pointer-events: all;
  letter-spacing: 1px; text-transform: uppercase;
}
#hsExpandBtn:hover { color: rgba(255,255,255,0.4); }
#hsFull { display: none; margin-top: 12px; }
#hsTable { width: 100%; border-collapse: collapse; font-size: 12px; }
#hsTable th { color: rgba(255,255,255,0.25); font-weight: 500; padding: 3px 6px; border-bottom: 1px solid rgba(255,255,255,0.07); text-align: left; }
#hsTable td { padding: 4px 6px; color: rgba(255,255,255,0.55); }
#hsTable tr:first-child td { color: #ffd740; }
#hsTable tr:nth-child(2) td { color: #c0c0c0; }
#hsTable tr:nth-child(3) td { color: #cd7f32; }
.hs-empty { color: rgba(255,255,255,0.2); font-size: 12px; padding: 6px 0; }

/* ── Death screen ── */
#deathScreen { display: none; }
.death-title {
  font-size: 44px; font-weight: 900; letter-spacing: -1px;
  color: #ff3344; text-shadow: 0 0 30px rgba(255,30,50,0.6); margin-bottom: 16px;
}
.death-stats { font-size: 15px; color: rgba(255,255,255,0.5); line-height: 2.2; margin-bottom: 8px; }
.death-stats b { color: #ffcc00; font-weight: 700; }
#newHSBanner {
  font-size: 20px; font-weight: 800; color: #ffd740; letter-spacing: 1px;
  margin: 8px 0; display: none; animation: hsFlash 0.7s ease-in-out infinite alternate;
}
@keyframes hsFlash { from { opacity:1; } to { opacity:0.35; } }
#deathRank { font-size: 13px; color: rgba(255,255,255,0.3); margin: 4px 0 12px; }
.again-btn {
  display: inline-block; padding: 12px 36px; font-size: 16px; font-weight: 800;
  border: none; border-radius: 12px; cursor: pointer; pointer-events: all;
  background: linear-gradient(135deg, #ff3344, #ff7700); color: #fff;
  transition: all 0.2s; margin-top: 16px; letter-spacing: 0.5px;
}
.again-btn:hover { transform: translateY(-1px); box-shadow: 0 0 24px rgba(255,60,60,0.35); }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<canvas id="minimapCanvas" width="150" height="150"></canvas>

<div id="hud">
  <div>Score: <span id="scoreVal">0</span></div>
  <div>Length: <span id="lengthVal">0</span></div>
  <div>Kills: <span id="killsVal">0</span></div>
  <div id="dashStatus"></div>
</div>
<div id="leaderboard">
  <div class="lb-title">🏆 Leaderboard</div>
  <div id="lbList"></div>
</div>
<div id="powerupBar"></div>

<div id="overlay">
  <!-- Title screen -->
  <div id="titleScreen" class="screen">
    <div class="game-title">willbussy.io</div>
    <div class="subtitle">slither &nbsp;·&nbsp; grow &nbsp;·&nbsp; dominate</div>
    <canvas id="logoCanvas" width="340" height="44"></canvas>
    <hr class="divider">
    <div class="skin-label">Choose your skin</div>
    <div class="skins" id="skinSelector"></div>
    <hr class="divider">
    <div class="play-row">
      <input id="playerNameInput" type="text" placeholder="Your name" maxlength="15">
      <button class="play-btn" onclick="startGame()">PLAY</button>
    </div>
    <div class="controls-hint">
      <kbd>WASD</kbd> / mouse move &nbsp;·&nbsp; <kbd>click</kbd> or <kbd>space</kbd> boost &nbsp;·&nbsp; <kbd>shift</kbd> dash at 50+
    </div>
    <div id="hsSection">
      <hr class="divider" style="margin-top:14px;">
      <div id="hsSummary"></div>
      <button id="hsExpandBtn" onclick="toggleHsFull()">▾ all scores</button>
      <div id="hsFull"><div id="hsTitleContent"></div></div>
    </div>
  </div>

  <!-- Death screen -->
  <div id="deathScreen" class="screen">
    <div class="death-title">YOU DIED</div>
    <div id="newHSBanner">🏆 NEW HIGH SCORE</div>
    <div class="death-stats">
      Score: <b id="dScore">0</b> &nbsp;·&nbsp;
      Length: <b id="dLength">0</b> &nbsp;·&nbsp;
      Slurped: <b id="dKills">0</b>
    </div>
    <div id="deathRank"></div>
    <hr class="divider">
    <div id="hsDeathContent"></div>
    <button class="again-btn" onclick="resetGame()">PLAY AGAIN</button>
  </div>
</div>

<script>
// ─── CONSTANTS ───────────────────────────────────────────────
const WW = 4000, WH = 4000;
const SEG_R = 10, SEG_GAP = 9;
const ORB_TARGET = 350;
const PU_TARGET  = 10;
const AI_N = 15;
const BASE_SPD   = 2.8;
const BOOST_SPD  = 5.6;
const DASH_SPD   = 13;
const DASH_MIN   = 50;   // min length to unlock dash
const DASH_DUR   = 500;  // ms dash lasts
const DASH_CD    = 3000; // ms cooldown after dash ends
const TURN       = 0.11;
const PU_DUR     = 8000;
const BORDER_MARGIN = 25;

// ─── CANVAS ──────────────────────────────────────────────────
const gc = document.getElementById('gameCanvas');
const gx = gc.getContext('2d');
const mc = document.getElementById('minimapCanvas');
const mx = mc.getContext('2d');
function resize() { gc.width = innerWidth; gc.height = innerHeight; }
resize(); addEventListener('resize', resize);

// ─── SKINS ───────────────────────────────────────────────────
const SKINS = {
  neon:   { grad:['#00ffff','#0088ff','#00ffaa'], glow:'#00ffcc', icon:'⚡', label:'NEON',   bg:'linear-gradient(135deg,#001133,#002255)' },
  fire:   { grad:['#ff1100','#ff6600','#ffcc00'], glow:'#ff4400', icon:'🔥', label:'FIRE',   bg:'linear-gradient(135deg,#330000,#661100)' },
  galaxy: { grad:['#7700ff','#cc44ff','#ff00cc'], glow:'#aa22ff', icon:'🌌', label:'GALAXY', bg:'linear-gradient(135deg,#110033,#220055)' },
  ocean:  { grad:['#0077ff','#00aaff','#00ffee'], glow:'#00aaff', icon:'🌊', label:'OCEAN',  bg:'linear-gradient(135deg,#001122,#002244)' },
  venom:  { grad:['#44ff00','#aaff00','#ffff00'], glow:'#66ff00', icon:'☠️', label:'VENOM',  bg:'linear-gradient(135deg,#001100,#003300)' },
  ice:    { grad:['#aaeeff','#66ddff','#ffffff'], glow:'#88eeff', icon:'❄️', label:'ICE',    bg:'linear-gradient(135deg,#001133,#003355)' },
  rattk:  { grad:['#7a7060','#5c5048','#a09080'], glow:'#ffaabb', icon:'🐭', label:'RATT K',  bg:'linear-gradient(135deg,#1a1510,#2a2018)' },
  shadow: { grad:['#440088','#8800cc','#cc44ff'], glow:'#9900ff', icon:'🌑', label:'SHADOW', bg:'linear-gradient(135deg,#0a0011,#150022)' },
};
const AI_NAMES = ['SlimeyBoi','SnekMaster','CoilKing','WormGod','SerpentPro','NoodleLord','ViperrX','ScaleGod','TailWhip','BoaFlex','CobrazZ','AnacondaX','SsssSlayer','VenomByte','ToxicCoil','RingWorm69','NoodleArms','SlitherKing','LengthGang','Ouroboros'];
const SKIN_KEYS = Object.keys(SKINS);

// ─── POWERUP CONFIG ──────────────────────────────────────────
const PU_TYPES  = ['speed','ghost','magnet'];
const PU_ICONS  = { speed:'⚡', ghost:'👻', magnet:'🧲' };
const PU_COLORS = { speed:'#ffff00', ghost:'#aaccff', magnet:'#ff88ff' };

// ─── UTILS ───────────────────────────────────────────────────
const rnd  = (a,b) => a + Math.random()*(b-a);
const rint = (a,b) => Math.floor(rnd(a,b+0.9999));
const dst  = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
function lerpAng(a,b,t){
  let d=b-a; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; return a+d*t;
}
function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mixColor(c1,c2,t){
  const[r1,g1,b1]=hexRGB(c1),[r2,g2,b2]=hexRGB(c2);
  return `rgb(${~~(r1+(r2-r1)*t)},${~~(g1+(g2-g1)*t)},${~~(b1+(b2-b1)*t)})`;
}
function toScreen(wx,wy){ return {x:wx-cam.x, y:wy-cam.y}; }
function onScreen(wx,wy,pad=60){
  const s=toScreen(wx,wy); return s.x>-pad&&s.x<gc.width+pad&&s.y>-pad&&s.y<gc.height+pad;
}

// ─── HIGH SCORES ─────────────────────────────────────────────
const HS_KEY = 'willbussy_hs';
function getHS(){ try{ return JSON.parse(localStorage.getItem(HS_KEY)||'[]'); }catch{ return []; } }
function saveHS(name, score, length, kills){
  const list = getHS();
  list.push({ name, score, length, kills, date: new Date().toLocaleDateString() });
  list.sort((a,b)=>b.score-a.score);
  const top = list.slice(0,10);
  localStorage.setItem(HS_KEY, JSON.stringify(top));
  return top.findIndex(e=>e.score===score && e.name===name);
}
let hsFulOpen = false;
function toggleHsFull(){
  hsFulOpen=!hsFulOpen;
  document.getElementById('hsFull').style.display=hsFulOpen?'block':'none';
  document.getElementById('hsExpandBtn').textContent=hsFulOpen?'▴ hide':'▾ all scores';
}
function renderHSSummary(){
  const list=getHS();
  const medals=['🥇','🥈','🥉'];
  const sum=document.getElementById('hsSummary');
  if(!sum) return;
  if(!list.length){ sum.innerHTML='<span style="color:rgba(255,255,255,0.2);font-size:12px;">No scores yet</span>'; return; }
  sum.innerHTML=list.slice(0,3).map((e,i)=>`<span>${medals[i]} ${e.name} — ${e.score}</span>`).join('');
}
function renderHSTable(containerId){
  const list = getHS();
  const el = document.getElementById(containerId);
  if(!list.length){ el.innerHTML='<div class="hs-empty">No scores yet — be the first!</div>'; return; }
  const medals = ['🥇','🥈','🥉'];
  el.innerHTML = `<table id="hsTable"><thead><tr>
    <th>#</th><th>Name</th><th>Score</th><th>Length</th><th>Date</th>
  </tr></thead><tbody>${list.map((e,i)=>`<tr>
    <td>${medals[i]||i+1}</td><td>${e.name}</td><td>${e.score}</td><td>${e.length}</td><td>${e.date}</td>
  </tr>`).join('')}</tbody></table>`;
}

// ─── GAME STATE ──────────────────────────────────────────────
let gstate = 'title';
let selSkin = 'neon';
let pName   = 'Player';
let player  = null;
let snakes  = [];
let orbs    = [];
let pups    = [];
let parts   = [];
let popups  = [];
let cam     = { x:0, y:0 };
let mpos    = { x:0, y:0 };
let keys    = {};
let spaceDown = false;
let rafId, lastT = 0;

// ─── INPUT ───────────────────────────────────────────────────
gc.addEventListener('mousemove', e => { mpos.x = e.clientX; mpos.y = e.clientY; });
gc.addEventListener('mousedown', e => { if(e.button===0) spaceDown=true; });
gc.addEventListener('mouseup',   e => { if(e.button===0) spaceDown=false; });
const GAME_KEYS = new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight','Space','ShiftLeft','ShiftRight']);
document.addEventListener('keydown', e => {
  if(gstate==='playing' && GAME_KEYS.has(e.code)) e.preventDefault();
  keys[e.code] = true;
  if(e.code==='Space') spaceDown=true;
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
  if(e.code==='Space') spaceDown=false;
});
// Touch: use swipe from center as direction
gc.addEventListener('touchmove', e => {
  e.preventDefault();
  const cx=gc.width/2, cy=gc.height/2;
  const dx=e.touches[0].clientX-cx, dy=e.touches[0].clientY-cy;
  if(player && player.alive){ player.tAngle = Math.atan2(dy,dx); }
}, {passive:false});
gc.addEventListener('touchstart', e => {
  spaceDown=true;
  const cx=gc.width/2, cy=gc.height/2;
  const dx=e.touches[0].clientX-cx, dy=e.touches[0].clientY-cy;
  if(player && player.alive){ player.tAngle = Math.atan2(dy,dx); }
});
gc.addEventListener('touchend', ()=>spaceDown=false);

// ─── ORB ─────────────────────────────────────────────────────
class Orb {
  constructor(special){
    this.r   = special ? rnd(10,16) : rnd(4,8);
    this.val = special ? rint(4,8)  : rint(1,2);
    this.hue = rint(0,360);
    this.ph  = rnd(0,Math.PI*2);
    this.spd = rnd(0.025,0.055);
    this.x   = rnd(special?150:80, WW-(special?150:80));
    this.y   = rnd(special?150:80, WH-(special?150:80));
  }
  draw(t){
    if(!onScreen(this.x,this.y,20)) return;
    const s=toScreen(this.x,this.y);
    const pulse=0.82+Math.sin(t*this.spd*60+this.ph)*0.18;
    const r=this.r*pulse;
    gx.save();
    gx.shadowColor=`hsl(${this.hue},100%,65%)`; gx.shadowBlur=12;
    gx.fillStyle=`hsl(${this.hue},100%,62%)`;
    gx.beginPath(); gx.arc(s.x,s.y,r,0,Math.PI*2); gx.fill();
    gx.fillStyle='rgba(255,255,255,0.55)';
    gx.beginPath(); gx.arc(s.x-r*0.28,s.y-r*0.28,r*0.32,0,Math.PI*2); gx.fill();
    gx.restore();
  }
}

// ─── POWERUP ─────────────────────────────────────────────────
class PowerUp {
  constructor(){
    this.x=rnd(200,WW-200); this.y=rnd(200,WH-200);
    this.type=PU_TYPES[rint(0,PU_TYPES.length-1)];
    this.R=16; this.ph=rnd(0,Math.PI*2); this.alive=true;
  }
  draw(t){
    if(!this.alive||!onScreen(this.x,this.y,40)) return;
    const s=toScreen(this.x,this.y);
    const bob=Math.sin(t*0.002+this.ph)*4;
    const col=PU_COLORS[this.type];
    gx.save();
    gx.shadowColor=col; gx.shadowBlur=22;
    gx.globalAlpha=0.55+Math.sin(t*0.003+this.ph)*0.45;
    gx.strokeStyle=col; gx.lineWidth=2;
    gx.beginPath(); gx.arc(s.x,s.y+bob,this.R+6,0,Math.PI*2); gx.stroke();
    gx.globalAlpha=0.85; gx.fillStyle='rgba(0,0,0,0.72)';
    gx.beginPath(); gx.arc(s.x,s.y+bob,this.R,0,Math.PI*2); gx.fill();
    gx.globalAlpha=1; gx.font='16px Arial'; gx.textAlign='center'; gx.textBaseline='middle';
    gx.fillText(PU_ICONS[this.type],s.x,s.y+bob);
    gx.restore();
  }
}

// ─── PARTICLE ────────────────────────────────────────────────
class Particle {
  constructor(x,y,col){ this.x=x;this.y=y;this.col=col; this.vx=rnd(-3,3);this.vy=rnd(-3.5,3.5); this.r=rnd(2,5);this.life=1;this.dec=rnd(0.018,0.04); }
  update(){ this.x+=this.vx;this.y+=this.vy;this.vx*=0.94;this.vy*=0.94;this.life-=this.dec;return this.life>0; }
  draw(){ const s=toScreen(this.x,this.y); gx.save();gx.globalAlpha=this.life;gx.fillStyle=this.col;gx.shadowColor=this.col;gx.shadowBlur=8; gx.beginPath();gx.arc(s.x,s.y,this.r*this.life,0,Math.PI*2);gx.fill();gx.restore(); }
}

// ─── POPUP ───────────────────────────────────────────────────
class Popup {
  constructor(txt,big=false){ this.txt=txt; this.sy=gc.height*0.33; this.life=1; this.big=big; }
  update(){ this.sy-=0.55; this.life-=0.013; return this.life>0; }
  draw(){
    gx.save(); gx.globalAlpha=Math.min(this.life*1.8,1);
    gx.font=`bold ${this.big?44:36}px "Arial Black",Arial,sans-serif`;
    gx.textAlign='center'; gx.textBaseline='middle';
    gx.shadowColor=this.big?'#00ffcc':'#ff6600'; gx.shadowBlur=22;
    gx.fillStyle=this.big?'#ffffff':'#ffcc00';
    gx.fillText(this.txt,gc.width/2,this.sy);
    gx.restore();
  }
}

// ─── SNAKE ───────────────────────────────────────────────────
class Snake {
  constructor(x,y,skin,isPlayer,name){
    this.skin=skin; this.isPlayer=isPlayer; this.name=name;
    this.alive=true; this.score=0; this.kills=0; this.streak=0;
    this.angle=rnd(0,Math.PI*2); this.tAngle=this.angle;
    this.fx={};
    this.segs=[];
    for(let i=0;i<22;i++) this.segs.push({x:x-Math.cos(this.angle)*i*SEG_GAP,y:y-Math.sin(this.angle)*i*SEG_GAP});
    if(!isPlayer){
      this.aiCD=0;
      this.skill   = rnd(0.35, 1.0); // reaction quality, prediction accuracy
      this.aiState = 'food';         // current intent: food | hunt | flee | dodge
      this.chasing = false;
    }
    this._streakTimer=null;
    // Dash state
    this.dashing      = false;
    this.dashEnd      = 0;
    this.dashCooldownEnd = 0;
    this._shiftConsumed  = false;
    this._dashWarnCD  = null;
    this.dashTrail    = [];
    this.shrinkTimer  = 0;
  }
  get head(){ return this.segs[0]; }
  get len() { return this.segs.length; }
  hasEff(t){ return this.fx[t] && this.fx[t]>Date.now(); }
  giveEff(t){ this.fx[t]=Date.now()+PU_DUR; }

  grow(n){
    const tail=this.segs[this.segs.length-1];
    for(let i=0;i<n;i++) this.segs.push({x:tail.x,y:tail.y});
    this.score+=n;
  }

  update(){
    if(!this.alive) return;
    this.isPlayer ? this._playerSteer() : this._aiSteer();
    this.angle=lerpAng(this.angle,this.tAngle,TURN);

    const now2=Date.now();
    const boost = this.isPlayer && spaceDown && this.len > 20;

    // ── Dash logic ────────────────────────────────────────────
    if(this.isPlayer){
      const shiftHeld = keys['ShiftLeft']||keys['ShiftRight'];
      if(shiftHeld && !this._shiftConsumed){
        this._shiftConsumed=true;
        if(!this.dashing && now2>this.dashCooldownEnd){
          if(this.len>=DASH_MIN){
            this.dashing=true;
            this.dashEnd=now2+DASH_DUR;
            this.dashCooldownEnd=now2+DASH_DUR+DASH_CD;
            popups.push(new Popup('💨 DASH!',true));
          } else if(!this._dashWarnCD){
            popups.push(new Popup(`Need length ${DASH_MIN} to dash`));
            this._dashWarnCD=setTimeout(()=>{ this._dashWarnCD=null; },2200);
          }
        }
      }
      if(!shiftHeld) this._shiftConsumed=false;
      if(this.dashing && now2>this.dashEnd) this.dashing=false;
    }

    // ── Speed ─────────────────────────────────────────────────
    let spd=BASE_SPD;
    if(this.hasEff('speed')) spd*=1.6;
    if(this.dashing)  spd=DASH_SPD;
    else if(boost)    spd=BOOST_SPD;
    else if(!this.isPlayer && this.chasing) spd*=1.35;

    // ── Move head ─────────────────────────────────────────────
    this.segs.unshift({x:this.head.x+Math.cos(this.angle)*spd, y:this.head.y+Math.sin(this.angle)*spd});

    // ── Shrink (slither.io-style: drain 1 extra seg every N frames) ──
    this.segs.pop(); // always remove tail to hold length
    if((this.dashing || boost) && this.segs.length > 12){
      this.shrinkTimer++;
      const rate = this.dashing ? 4 : 6; // dash drains faster than boost
      if(this.shrinkTimer >= rate){
        this.segs.pop();
        this.shrinkTimer = 0;
      }
    } else {
      this.shrinkTimer = 0;
    }

    // ── Dash trail ────────────────────────────────────────────
    if(this.dashing){
      this.dashTrail.unshift({x:this.head.x,y:this.head.y});
      if(this.dashTrail.length>14) this.dashTrail.pop();
    } else {
      this.dashTrail=[];
    }

    // ── Follow chain ──────────────────────────────────────────
    for(let i=1;i<this.segs.length;i++){
      const p=this.segs[i-1],c=this.segs[i];
      const dx=p.x-c.x, dy=p.y-c.y, d=Math.hypot(dx,dy);
      if(d>SEG_GAP){ c.x=p.x-(dx/d)*SEG_GAP; c.y=p.y-(dy/d)*SEG_GAP; }
    }

    // ── Magnet ────────────────────────────────────────────────
    if(this.isPlayer && this.hasEff('magnet')){
      for(const o of orbs){ const d=dst(this.head,o); if(d<220){ o.x+=(this.head.x-o.x)*0.06; o.y+=(this.head.y-o.y)*0.06; } }
    }

    // ── Border kill ───────────────────────────────────────────
    const h=this.head;
    if(h.x<BORDER_MARGIN||h.x>WW-BORDER_MARGIN||h.y<BORDER_MARGIN||h.y>WH-BORDER_MARGIN){ this.die(); return; }

    // ── Eat orbs ──────────────────────────────────────────────
    for(let i=orbs.length-1;i>=0;i--){
      const o=orbs[i];
      if(dst(h,o)<SEG_R+o.r){
        this.grow(o.val);
        for(let p=0;p<5;p++) parts.push(new Particle(o.x,o.y,`hsl(${o.hue},100%,65%)`));
        orbs.splice(i,1); orbs.push(new Orb());
      }
    }

    // ── Pick up powerups ──────────────────────────────────────
    for(let i=pups.length-1;i>=0;i--){
      const pu=pups[i];
      if(pu.alive && dst(h,pu)<SEG_R+pu.R){
        this.giveEff(pu.type); pu.alive=false;
        pups.splice(i,1);
        setTimeout(()=>pups.push(new PowerUp()),300);
        if(this.isPlayer) popups.push(new Popup(`${PU_ICONS[pu.type]} ${pu.type.toUpperCase()}!`));
      }
    }
  }

  _playerSteer(){
    const wasdActive = keys['KeyD']||keys['ArrowRight']||keys['KeyA']||keys['ArrowLeft']||keys['KeyS']||keys['ArrowDown']||keys['KeyW']||keys['ArrowUp'];
    if(wasdActive){
      let dx=0, dy=0;
      if(keys['KeyD']||keys['ArrowRight']) dx+=1;
      if(keys['KeyA']||keys['ArrowLeft'])  dx-=1;
      if(keys['KeyS']||keys['ArrowDown'])  dy+=1;
      if(keys['KeyW']||keys['ArrowUp'])    dy-=1;
      if(dx!==0||dy!==0) this.tAngle=Math.atan2(dy,dx);
    } else {
      // Mouse fallback
      const dx=mpos.x-gc.width/2, dy=mpos.y-gc.height/2;
      if(Math.abs(dx)>4||Math.abs(dy)>4) this.tAngle=Math.atan2(dy,dx);
    }
  }

  _aiSteer(){
    const h=this.head;

    // ── Border avoidance (always immediate) ───────────────────
    const M=180;
    if(h.x<M||h.x>WW-M||h.y<M||h.y>WH-M){
      this.chasing=false; this.aiState='wander';
      this.tAngle=Math.atan2(WH/2-h.y, WW/2-h.x);
      return;
    }

    this.aiCD--;
    if(this.aiCD>0) return;
    // Skilled bots react faster; less skilled react slower
    this.aiCD=rint(~~(8+14*(1-this.skill)), ~~(18+22*(1-this.skill)));

    // ── Scan nearby snakes ────────────────────────────────────
    let threat=null, threatD=Infinity;  // bigger snake head nearby
    let prey=null,   preyD=Infinity;    // smaller snake head to hunt
    let dangerSeg=null, dangerD=Infinity; // any body segment too close

    for(const sn of snakes){
      if(!sn.alive||sn===this) continue;
      const dh=dst(h,sn.head);

      // Bigger head = threat; run away
      if(sn.len>this.len*1.05 && dh<260*this.skill+80){
        if(dh<threatD){ threatD=dh; threat=sn; }
      }
      // Smaller head = prey; intercept to kill
      if(sn.len<this.len*0.95 && dh<350*this.skill+100){
        if(dh<preyD){ preyD=dh; prey=sn; }
      }
      // Body segments — dodge if too close
      const step = Math.max(2, ~~(4*(1-this.skill*0.5)));
      for(let i=0;i<sn.segs.length;i+=step){
        const db=dst(h,sn.segs[i]);
        if(db<dangerD){ dangerD=db; dangerSeg=sn.segs[i]; }
      }
    }

    // ── Priority 1: Flee from a bigger snake ──────────────────
    if(threat && threatD<160){
      this.chasing=false; this.aiState='flee';
      // Run directly away; add slight random juke
      this.tAngle=Math.atan2(h.y-threat.head.y, h.x-threat.head.x)+rnd(-0.3,0.3);
      return;
    }

    // ── Priority 2: Dodge nearby body segments ────────────────
    const dodgeRange=30+22*this.skill;
    if(dangerSeg && dangerD<dodgeRange && Math.random()<0.55+this.skill*0.3){
      this.chasing=false; this.aiState='dodge';
      this.tAngle=Math.atan2(h.y-dangerSeg.y, h.x-dangerSeg.x)+rnd(-0.4,0.4);
      return;
    }

    // ── Priority 3: Hunt smaller snake (not just player) ──────
    if(prey && preyD<300+this.skill*150){
      this.chasing=true; this.aiState='hunt';
      // Predict where prey is heading; lead shot scales with skill
      const lead=~~(10+this.skill*25);
      const predX=prey.head.x+Math.cos(prey.angle)*BASE_SPD*lead;
      const predY=prey.head.y+Math.sin(prey.angle)*BASE_SPD*lead;
      // Very close? go straight for the head; far? aim ahead
      const target = preyD<130 ? prey.head : {x:predX, y:predY};
      // Add imprecision for lower-skill bots
      const err=(1-this.skill)*0.6;
      this.tAngle=Math.atan2(target.y-h.y, target.x-h.x)+rnd(-err,err);
      return;
    }

    // ── Priority 4: Eat food ──────────────────────────────────
    this.chasing=false; this.aiState='food';
    let near=null, nd=Infinity;
    for(const o of orbs){ const d=dst(h,o); if(d<nd){nd=d;near=o;} }
    if(near && nd<650) this.tAngle=Math.atan2(near.y-h.y, near.x-h.x);
    else{ this.tAngle+=rnd(-0.6,0.6); }
  }

  die(){
    if(!this.alive) return;
    this.alive=false;
    const drop=Math.min(Math.floor(this.len/6),40);
    for(let i=0;i<drop;i++){
      const seg=this.segs[rint(0,this.segs.length-1)];
      const o=new Orb(true);
      o.x=seg.x+rnd(-25,25); o.y=seg.y+rnd(-25,25);
      o.val=1; o.r=rnd(6,10); o.hue=rint(80,160);
      orbs.push(o);
    }
    for(let i=0;i<Math.min(this.segs.length,25);i++)
      parts.push(new Particle(this.segs[i].x,this.segs[i].y,SKINS[this.skin].glow));

    if(!this.isPlayer){
      setTimeout(()=>{ const idx=snakes.indexOf(this); if(idx!==-1) snakes[idx]=spawnAI(); },3500);
    } else {
      setTimeout(showDeath, 900);
    }
  }

  draw(now){
    if(!this.alive) return;
    const sk=SKINS[this.skin];
    const ghost=this.hasEff('ghost');
    gx.save();
    if(ghost) gx.globalAlpha=0.42;

    // Dash trail
    for(let i=0;i<this.dashTrail.length;i++){
      const tp=toScreen(this.dashTrail[i].x,this.dashTrail[i].y);
      gx.globalAlpha=(1-i/this.dashTrail.length)*0.55*(ghost?0.4:1);
      gx.fillStyle=sk.glow; gx.shadowColor=sk.glow; gx.shadowBlur=25;
      gx.beginPath(); gx.arc(tp.x,tp.y,SEG_R*1.4,0,Math.PI*2); gx.fill();
    }
    if(ghost) gx.globalAlpha=0.42; else gx.globalAlpha=1;

    // Body segments
    for(let i=this.segs.length-1;i>=0;i--){
      const seg=this.segs[i];
      if(!onScreen(seg.x,seg.y,SEG_R+4)) continue;
      const s=toScreen(seg.x,seg.y);
      const t=i/(this.segs.length-1);
      const ci=Math.floor(t*(sk.grad.length-1));
      const ni=Math.min(ci+1,sk.grad.length-1);
      const col=mixColor(sk.grad[ci],sk.grad[ni],(t*(sk.grad.length-1))-ci);
      const r=SEG_R*(1-t*0.38);
      gx.shadowColor=sk.glow;
      gx.shadowBlur=this.dashing ? (i===0?35:14) : (i===0?16:5);
      gx.fillStyle=col;
      gx.beginPath(); gx.arc(s.x,s.y,r,0,Math.PI*2); gx.fill();
    }

    // Eyes
    if(onScreen(this.head.x,this.head.y,SEG_R*2)){
      const hs=toScreen(this.head.x,this.head.y);
      const ea1=this.angle-0.48, ea2=this.angle+0.48, eo=SEG_R*0.38;
      gx.shadowBlur=0; gx.fillStyle='#fff';
      gx.beginPath();
      gx.arc(hs.x+Math.cos(ea1)*eo,hs.y+Math.sin(ea1)*eo,3.2,0,Math.PI*2);
      gx.arc(hs.x+Math.cos(ea2)*eo,hs.y+Math.sin(ea2)*eo,3.2,0,Math.PI*2);
      gx.fill();
      gx.fillStyle='#111';
      gx.beginPath();
      gx.arc(hs.x+Math.cos(ea1)*eo+0.8,hs.y+Math.sin(ea1)*eo+0.8,1.6,0,Math.PI*2);
      gx.arc(hs.x+Math.cos(ea2)*eo+0.8,hs.y+Math.sin(ea2)*eo+0.8,1.6,0,Math.PI*2);
      gx.fill();
      gx.globalAlpha=1; gx.font='bold 11px Arial'; gx.textAlign='center'; gx.textBaseline='bottom';
      gx.fillStyle='rgba(255,255,255,0.88)'; gx.shadowBlur=0;
      gx.fillText(this.name,hs.x,hs.y-SEG_R-4);
      // Rat face on head for RATT K skin
      if(this.skin==='rattk'){
        gx.font=`${~~(SEG_R*2.2)}px Arial`;
        gx.textBaseline='middle'; gx.shadowBlur=0;
        gx.fillText('🐭',hs.x,hs.y);
      }
    }
    gx.restore();
  }
}

// ─── COLLISION ───────────────────────────────────────────────
function checkCollisions(){
  if(!player||!player.alive) return;
  const h=player.head;

  if(!player.hasEff('ghost')){
    for(const sn of snakes){
      if(!sn.alive || sn===player) continue; // no self-collision
      for(let i=0;i<sn.segs.length;i++){
        if(dst(h,sn.segs[i])<SEG_R*1.55){
          player.die(); sn.score+=player.len*2; return;
        }
      }
    }
  }

  for(const sn of snakes){
    if(!sn.alive||sn===player||sn.hasEff('ghost')) continue;
    const sh=sn.head;
    let killed=false;
    for(let i=4;i<player.segs.length;i++){
      if(dst(sh,player.segs[i])<SEG_R*1.5){
        sn.die(); player.kills++; player.streak++; player.score+=sn.len*2;
        clearTimeout(player._streakTimer);
        player._streakTimer=setTimeout(()=>{ player.streak=0; },6000);
        popups.push(new Popup(player.streak>1?`SLURPED! 🐍 x${player.streak}`:'SLURPED! 🐍'));
        updateHUD(); killed=true; break;
      }
    }
    if(killed) continue;
    for(const other of snakes){
      if(!other.alive||other===sn) continue;
      for(let i=4;i<other.segs.length;i++){
        if(dst(sh,other.segs[i])<SEG_R*1.4){ sn.die(); break; }
      }
      if(!sn.alive) break;
    }
  }
}

// ─── SPAWNERS ────────────────────────────────────────────────
function spawnPlayer(){
  const x=rnd(600,WW-600), y=rnd(600,WH-600);
  player=new Snake(x,y,selSkin,true,pName);
  snakes.push(player);
}
function spawnAI(){
  const sk=SKIN_KEYS[rint(0,SKIN_KEYS.length-1)];
  const nm=AI_NAMES[rint(0,AI_NAMES.length-1)];
  const sn=new Snake(rnd(300,WW-300),rnd(300,WH-300),sk,false,nm);
  sn.grow(rint(15,60)); return sn;
}

// ─── BACKGROUND ──────────────────────────────────────────────
function drawBG(now){
  const t=(now%120000)/120000;
  const night=(Math.cos(t*Math.PI*2)+1)/2;
  gx.fillStyle=`rgb(${~~(16+(2-16)*night)},${~~(22+(2-22)*night)},${~~(52+(8-52)*night)})`;
  gx.fillRect(0,0,gc.width,gc.height);
  const gs=100, ox=cam.x%gs, oy=cam.y%gs;
  gx.strokeStyle=`rgba(255,255,255,${0.045-night*0.025})`; gx.lineWidth=1;
  for(let x=-ox;x<gc.width;x+=gs){ gx.beginPath();gx.moveTo(x,0);gx.lineTo(x,gc.height);gx.stroke(); }
  for(let y=-oy;y<gc.height;y+=gs){ gx.beginPath();gx.moveTo(0,y);gx.lineTo(gc.width,y);gx.stroke(); }
  const bx=-cam.x, by=-cam.y;
  gx.shadowColor='#ff3333'; gx.shadowBlur=28;
  gx.strokeStyle='rgba(255,40,40,0.55)'; gx.lineWidth=5;
  gx.strokeRect(bx,by,WW,WH); gx.shadowBlur=0;
  if(night>0.8){ gx.save();gx.globalAlpha=(night-0.8)/0.2*0.4;gx.font='bold 18px Arial';gx.textAlign='center';gx.fillStyle='#8888ff';gx.fillText('🌙 Night',gc.width/2,gc.height-14);gx.restore(); }
  else if(night<0.2){ gx.save();gx.globalAlpha=(0.2-night)/0.2*0.4;gx.font='bold 18px Arial';gx.textAlign='center';gx.fillStyle='#ffdd88';gx.fillText('☀️ Day',gc.width/2,gc.height-14);gx.restore(); }
}

// ─── MINIMAP ─────────────────────────────────────────────────
function drawMinimap(){
  const sc=mc.width/WW;
  mx.clearRect(0,0,mc.width,mc.height);
  mx.fillStyle='rgba(0,0,0,0.7)'; mx.fillRect(0,0,mc.width,mc.height);
  for(const o of orbs){ mx.fillStyle=`hsl(${o.hue},100%,60%)`; mx.fillRect(o.x*sc-0.8,o.y*sc-0.8,1.6,1.6); }
  for(const sn of snakes){
    if(!sn.alive) continue;
    mx.fillStyle=sn===player?'#ffffff':SKINS[sn.skin].grad[0];
    mx.beginPath(); mx.arc(sn.head.x*sc,sn.head.y*sc,sn===player?3:2,0,Math.PI*2); mx.fill();
  }
  if(player){ mx.strokeStyle='rgba(255,255,255,0.35)'; mx.lineWidth=1; mx.strokeRect(cam.x*sc,cam.y*sc,gc.width*sc,gc.height*sc); }
}

// ─── HUD ─────────────────────────────────────────────────────
function updateHUD(){
  if(!player) return;
  document.getElementById('scoreVal').textContent=player.score;
  document.getElementById('lengthVal').textContent=player.len;
  document.getElementById('killsVal').textContent=player.kills;

  // Dash status
  const ds=document.getElementById('dashStatus');
  const now2=Date.now();
  if(player.len<DASH_MIN){
    ds.textContent=`DASH: grow to ${DASH_MIN}`;
    ds.style.color='#555';
  } else if(player.dashing){
    ds.textContent='💨 DASHING!';
    ds.style.color='#ffffff';
  } else if(now2<player.dashCooldownEnd){
    const secs=((player.dashCooldownEnd-now2)/1000).toFixed(1);
    ds.textContent=`DASH: ${secs}s`;
    ds.style.color='#ff8800';
  } else {
    ds.textContent='DASH: READY [SHIFT]';
    ds.style.color='#00ff88';
  }

  // In-game leaderboard
  const alive=snakes.filter(s=>s.alive).sort((a,b)=>b.len-a.len).slice(0,7);
  document.getElementById('lbList').innerHTML=alive.map((s,i)=>{
    const medals=['🥇','🥈','🥉'];
    const m=medals[i]||(i+1+'.');
    const you=s===player;
    return `<div style="padding:2px 0;${you?'color:#00ffcc;font-weight:bold;':'color:#ccc;'}">${m} ${s.name} — ${s.len}</div>`;
  }).join('');
}

function updatePUBar(){
  if(!player) return;
  const bar=document.getElementById('powerupBar');
  bar.innerHTML='';
  const now2=Date.now();
  for(const[type,exp] of Object.entries(player.fx)){
    if(exp>now2){
      const secs=Math.ceil((exp-now2)/1000);
      const chip=document.createElement('div');
      chip.className='pu-chip'; chip.style.borderColor=PU_COLORS[type];
      chip.innerHTML=`${PU_ICONS[type]}<small>${secs}s</small>`;
      bar.appendChild(chip);
    }
  }
}

// ─── INIT / LOOP ─────────────────────────────────────────────
function initGame(){
  snakes=[]; orbs=[]; pups=[]; parts=[]; popups=[];
  for(let i=0;i<ORB_TARGET;i++) orbs.push(new Orb());
  for(let i=0;i<PU_TARGET;i++) pups.push(new PowerUp());
  spawnPlayer();
  for(let i=0;i<AI_N;i++) snakes.push(spawnAI());
  cam.x=player.head.x-gc.width/2;
  cam.y=player.head.y-gc.height/2;
}

function loop(now){
  if(gstate!=='playing') return;
  if(player&&player.alive){
    cam.x+=(player.head.x-gc.width/2-cam.x)*0.09;
    cam.y+=(player.head.y-gc.height/2-cam.y)*0.09;
  }
  drawBG(now);
  for(const o of orbs) o.draw(now);
  for(const pu of pups) pu.draw(now);
  for(const sn of snakes){ if(!sn.isPlayer) sn.update(); }
  if(player) player.update();
  checkCollisions();
  for(const sn of snakes){ if(sn!==player) sn.draw(now); }
  if(player) player.draw(now);
  parts =parts.filter(p=>{ const a=p.update(); if(a)p.draw(); return a; });
  popups=popups.filter(p=>{ const a=p.update(); if(a)p.draw(); return a; });
  if(Math.floor(now/100)!==Math.floor((now-16)/100)){ updateHUD(); updatePUBar(); }
  drawMinimap();
  rafId=requestAnimationFrame(loop);
}

// ─── SCREEN FUNCTIONS ────────────────────────────────────────
function renderSkinSelector(){
  const el=document.getElementById('skinSelector');
  el.innerHTML=Object.entries(SKINS).map(([key,sk])=>
    `<div class="skin-opt${key===selSkin?' sel':''}" id="sk-${key}" onclick="selectSkin('${key}')"
      style="background:${sk.bg};color:${sk.glow};">
      <span style="font-size:24px">${sk.icon}</span>${sk.label}
    </div>`
  ).join('');
}
function selectSkin(sk){
  selSkin=sk;
  document.querySelectorAll('.skin-opt').forEach(el=>el.classList.toggle('sel',el.id==='sk-'+sk));
}

function startGame(){
  pName=(document.getElementById('playerNameInput').value.trim()||'Player').slice(0,15);
  document.getElementById('overlay').style.display='none';
  document.getElementById('hud').style.display='block';
  document.getElementById('leaderboard').style.display='block';
  document.getElementById('minimapCanvas').style.display='block';
  document.getElementById('powerupBar').style.display='flex';
  gstate='playing';
  initGame();
  rafId=requestAnimationFrame(loop);
}

function showDeath(){
  cancelAnimationFrame(rafId);
  gstate='dead';
  const score=player?player.score:0;
  const length=player?player.len:0;
  const kills=player?player.kills:0;

  // Save to high scores and get rank
  const rank=saveHS(pName,score,length,kills);

  document.getElementById('overlay').style.display='flex';
  document.getElementById('titleScreen').style.display='none';
  document.getElementById('deathScreen').style.display='block';
  document.getElementById('dScore').textContent=score;
  document.getElementById('dLength').textContent=length;
  document.getElementById('dKills').textContent=kills;

  const banner=document.getElementById('newHSBanner');
  const rankEl=document.getElementById('deathRank');
  if(rank===0){
    banner.style.display='block';
    rankEl.textContent='';
  } else if(rank>=0){
    banner.style.display='none';
    const medals=['🥇','🥈','🥉'];
    rankEl.textContent=`You ranked ${medals[rank]||'#'+(rank+1)} on the leaderboard!`;
  } else {
    banner.style.display='none';
    rankEl.textContent='';
  }

  renderHSTable('hsDeathContent');
  renderHSSummary();
}

function resetGame(){
  document.getElementById('deathScreen').style.display='none';
  document.getElementById('titleScreen').style.display='block';
  document.getElementById('overlay').style.display='flex';
  document.getElementById('hud').style.display='none';
  document.getElementById('leaderboard').style.display='none';
  document.getElementById('minimapCanvas').style.display='none';
  document.getElementById('powerupBar').style.display='none';
  gstate='title';
  player=null; snakes=[];
  renderSkinSelector();
  renderHSTable('hsTitleContent');
  renderHSSummary();
}

// ─── LOGO ANIMATION ──────────────────────────────────────────
(function logoAnim(){
  const lc=document.getElementById('logoCanvas');
  const lx=lc.getContext('2d');
  let t=0;
  function frame(){
    lx.clearRect(0,0,lc.width,lc.height);
    const N=18;
    const sk=SKINS[selSkin]; // live-update to whichever skin is selected
    for(let i=N-1;i>=0;i--){
      const x=14+i*17, y=22+Math.sin(i*0.44+t)*13;
      const progress=i/(N-1);
      const ci=Math.floor(progress*(sk.grad.length-1));
      const ni=Math.min(ci+1,sk.grad.length-1);
      const col=mixColor(sk.grad[ci],sk.grad[ni],(progress*(sk.grad.length-1))-ci);
      lx.shadowColor=sk.glow; lx.shadowBlur=12;
      lx.fillStyle=col;
      lx.beginPath(); lx.arc(x,y,7.5-progress*2.5,0,Math.PI*2); lx.fill();
    }
    t+=0.055;
    if(gstate==='title') requestAnimationFrame(frame);
    else setTimeout(()=>{ if(gstate==='title') requestAnimationFrame(frame); },500);
  }
  frame();
})();

// ─── INITIAL RENDER ──────────────────────────────────────────
renderSkinSelector();
renderHSTable('hsTitleContent');
</script>
